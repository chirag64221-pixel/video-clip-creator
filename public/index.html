<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip Cutter</title>
  <meta name="description" content="Paste a video link, get scored vertical clips with animated captions, and post them." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M11 9l12 7-12 7z' fill='white'/></svg>" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#" data-action="home">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 6l10 6-10 6z"/></svg></span>
      Clip Cutter
    </a>
    <nav>
      <button class="ghost" data-action="open-brand">Brand kit</button>
      <button class="ghost" data-action="open-accounts">Accounts</button>
      <button class="ghost icon-only" data-action="open-code" title="Access code" aria-label="Access code">
        <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0110 0v3M5 11h14v10H5z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </nav>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="app"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="close" data-action="close-modal" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
